    (function () {
      try {
        var m = localStorage.getItem('synoquant-mode');
        if (m) document.documentElement.setAttribute('data-mode', m);

        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
